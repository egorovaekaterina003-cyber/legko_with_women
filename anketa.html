<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анкета предзаписи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@800;900&display=swap">
<style>
:root{--bg:#12030a;--card:#1d0509;--line:rgba(232,64,110,.3);--gold:#e8406e;--gold2:#f6dfb8;--cream:#f6e8d6;--muted:#b89a94;--red:#8e0a33;--red2:#b8174f;
--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{min-height:100vh;background:radial-gradient(ellipse 70% 40% at 80% 0%,rgba(150,10,35,.35),transparent 70%),radial-gradient(ellipse 60% 40% at 10% 90%,rgba(150,10,35,.25),transparent 70%),var(--bg);color:var(--cream);font:400 16px/1.6 var(--sans)}
.hero{max-width:1100px;margin:0 auto}
.hero img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(0deg,transparent,#000 12%);mask-image:linear-gradient(0deg,transparent,#000 12%)}
main{max-width:560px;margin:-20px auto 0;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));position:relative}
.card{padding:32px 28px 28px;border-radius:24px;border:1px solid transparent;background:linear-gradient(170deg,#2a070e,#14030a) padding-box,linear-gradient(160deg,var(--gold2),var(--red) 50%,var(--gold)) border-box;box-shadow:0 40px 80px -40px rgba(196,18,47,.6)}
.card h1{margin:0 0 22px;text-align:center;font:italic 600 clamp(30px,6vw,40px)/1.1 var(--serif);color:var(--cream)}
.card h1:after{content:"";display:block;width:120px;height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.f{margin:0 0 18px}
.f > label,.f > .lbl{display:block;margin:0 0 8px;font:700 11.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.f input[type=text],.f input[type=email],.f input[type=tel]{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--cream);font:500 16px var(--sans);outline:none;transition:border-color .2s,box-shadow .2s}
.f input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,180,106,.18)}
.f input.bad{border-color:var(--red2)}
.err{display:none;margin:6px 0 0;font-size:13px;color:#ff8a9c}
.err.on{display:block}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts button{padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--cream);font:600 14px/1.25 var(--sans);cursor:pointer;transition:border-color .2s,background .2s}
.opts button:hover{border-color:rgba(224,180,106,.6)}
.opts button[aria-pressed=true]{border-color:var(--gold);background:linear-gradient(160deg,rgba(224,180,106,.22),rgba(196,18,47,.18));color:#fff}
.opts button:last-child:nth-child(odd){grid-column:1/-1}
.ok{display:flex;gap:10px;align-items:flex-start;margin:6px 0 20px;font-size:13.5px;line-height:1.45;color:var(--muted);cursor:pointer}
.ok a{color:#f3c4d0;text-decoration:underline;text-underline-offset:2px}
.ok input{flex:none;width:18px;height:18px;margin:1px 0 0;accent-color:var(--red)}
.go{display:block;width:100%;padding:17px 20px;border:0;border-radius:40px;background:linear-gradient(135deg,var(--red2),var(--red) 55%,#7d0a1e);color:#fff;font:800 15px var(--sans);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 16px 36px -14px var(--red),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .2s}
.go:hover{transform:translateY(-2px)}
.go:disabled{opacity:.6;transform:none;cursor:default}
.done{text-align:center;padding:10px 0 4px}
.done b{display:block;margin-bottom:8px;font:italic 600 32px/1.15 var(--serif);color:var(--cream)}
.done p{margin:0;color:var(--muted)}
@media(max-width:480px){.card{padding:26px 18px 22px}.opts button{font-size:13px}}
@media(prefers-reduced-motion:reduce){.go,.f input{transition:none}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.f > label,.f > .lbl{font:800 11px/1 'Unbounded','Manrope',sans-serif!important;letter-spacing:.08em!important;color:#f3c4d0!important}
.f input:focus{border-color:#e8406e!important;box-shadow:0 0 0 3px rgba(232,64,110,.2)!important}
.card{background:linear-gradient(170deg,#2a0812,#14030a) padding-box,linear-gradient(160deg,#f6dfb8,#b8174f 50%,#8e0a33) border-box!important;box-shadow:0 40px 80px -40px rgba(184,23,79,.7)!important}
.go{font:800 14px 'Unbounded','Manrope',sans-serif!important;background:linear-gradient(135deg,#b8174f,#8e0a33 55%,#5e0420)!important;box-shadow:0 16px 36px -14px #b8174f!important}
.done b{font:900 30px/1.2 'Unbounded','Manrope',sans-serif!important;text-transform:uppercase}
</style>
</head>

<main>
  <form class="card" id="form" novalidate>
    <h1 class="vh">Анкета предзаписи</h1>
    <div class="f">
      <label for="name">Имя и фамилия</label>
      <input type="text" id="name" autocomplete="name" placeholder="Иван Иванов">
      <p class="err" id="e-name">Напишите, пожалуйста, имя и фамилию.</p>
    </div>
    <div class="f">
      <label for="mail">E-mail</label>
      <input type="email" id="mail" autocomplete="email" inputmode="email" placeholder="name@mail.ru">
      <p class="err" id="e-mail">Проверьте, пожалуйста, e-mail.</p>
    </div>
    <div class="f">
      <label for="tel">Номер телефона</label>
      <input type="tel" id="tel" autocomplete="tel" inputmode="tel" placeholder="+7 900 000-00-00">
      <p class="err" id="e-tel">Проверьте, пожалуйста, номер телефона.</p>
    </div>
    <label class="ok"><input type="checkbox" id="agree"><span>Я даю согласие на <a href="https://docs.google.com/document/d/1NLhp2CXoyUQlDvfWpjQzBhwM3QFGrFwG/edit" target="_blank" rel="noopener">обработку персональных данных</a></span></label>
    <p class="err" id="e-ok" style="margin:-12px 0 16px">Нужно согласие на обработку данных.</p>
    <button class="go" type="submit" id="go">Отправить</button>
  </form>
</main>
<script>
/* адрес веб-приложения Google Apps Script (…/exec) — вставить, когда будет */
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzQS86-E-n6WvYGi40yoiZoeq4Ei66kZLDyi1o7Yu-9nKc7QoiC7hIijAffCD08N7nl/exec';
const $ = s => document.querySelector(s);
const sid = (() => { try { let v = localStorage.getItem('zl_sid'); if (!v) { v = Date.now().toString(36) + Math.random().toString(36).slice(2, 7); localStorage.setItem('zl_sid', v); } return v; } catch (e) { return 'p' + Date.now().toString(36); } })();
const utm = (() => { const q = new URLSearchParams(location.search), o = []; ['utm_source','utm_medium','utm_campaign','utm_content'].forEach(k => { if (q.get(k)) o.push(k.replace('utm_', '') + '=' + q.get(k)); }); return o.join(', '); })();
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#name').value.trim(), mail = $('#mail').value.trim().toLowerCase(), tel = $('#tel').value.trim(), digits = tel.replace(/\D/g, '');
  const okMail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail), okTel = digits.length >= 10 && digits.length <= 15, okAgree = $('#agree').checked;
  const okName = name.split(/\s+/).filter(w => w.length >= 2).length >= 2; $('#name').classList.toggle('bad', !okName); $('#e-name').classList.toggle('on', !okName);
  $('#mail').classList.toggle('bad', !okMail); $('#e-mail').classList.toggle('on', !okMail);
  $('#tel').classList.toggle('bad', !okTel); $('#e-tel').classList.toggle('on', !okTel);
  $('#e-ok').classList.toggle('on', !okAgree);
  if (!okName || !okMail || !okTel || !okAgree) return;
  const b = $('#go'); b.disabled = true; b.textContent = 'Отправляю…';
  if (SHEET_URL) {
    try {
      await fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ sid, event: 'Отправил анкету предзаписи', page: 'Анкета предзаписи',
          cols: { 'Предзапись': '@now', 'Предзапись: имя и фамилия': name, 'E-mail': mail, 'Телефон': tel, 'Согласие на обработку данных': 'да', '!UTM': utm } }) });
    } catch (err) {}
  }
  $('#form').innerHTML = '<div class="done"><b>Спасибо!</b><p>Анкета отправлена.</p></div>';
});
</script>
</body>
</html>
